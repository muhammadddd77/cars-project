<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход в систему — AutoDealer</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    :root {
      --bg-body: #f4f6f9;
      --bg-card: #ffffff;
      --text-main: #1f2226;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #e51a24;
      --primary-hover: #c4141d;
      --dark-btn: #1f2226;
      --input-bg: #f8fafc;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }

    body.dark-theme {
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --input-bg: #0f172a;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      transition: background-color 0.25s ease, color 0.2s ease, border-color 0.2s ease;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .top-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .theme-toggle-btn:hover {
      opacity: 0.9;
    }

    .login-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 36px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: #fee2e2;
      color: var(--primary);
      border-radius: 14px;
      font-size: 26px;
      margin-bottom: 12px;
    }

    body.dark-theme .brand-logo {
      background: rgba(229, 26, 36, 0.2);
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      color: var(--text-main);
      font-size: 15px;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(229, 26, 36, 0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .alert-box {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
    }

    .alert-error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    body.dark-theme .alert-error {
      background: rgba(220, 38, 38, 0.2);
      color: #fca5a5;
      border-color: #7f1d1d;
    }

    .quick-access-box {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }

    .quick-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-align: center;
    }

    .quick-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-quick {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-quick:hover {
      background: var(--border-color);
    }

    .credentials-hint {
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--input-bg);
      border-radius: 8px;
      padding: 8px 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="top-controls">
    <button id="themeToggleBtn" class="theme-toggle-btn" type="button">
      <span id="themeIcon">🌙</span> <span id="themeLabel">Темная тема</span>
    </button>
  </div>

  <div class="login-container">
    <div class="brand-header">
      <div class="brand-logo">🚗</div>
      <h1 class="brand-title">AutoDealer</h1>
      <p class="brand-subtitle">Вход в панель управления и каталог</p>
    </div>

    <div id="alertBox" class="alert-box alert-error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="usernameInput" class="form-label">Логин (username)</label>
        <input type="text" id="usernameInput" class="form-input" placeholder="admin или client" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="passwordInput" class="form-label">Пароль (password)</label>
        <input type="password" id="passwordInput" class="form-input" placeholder="Введите пароль" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-submit">Войти в систему</button>
    </form>

    <div class="quick-access-box">
      <div class="quick-title">Быстрый вход для проверки:</div>
      <div class="quick-btns">
        <button type="button" id="btnAdminQuick" class="btn-quick">
          🛡️ Admin
        </button>
        <button type="button" id="btnClientQuick" class="btn-quick">
          👤 Client
        </button>
      </div>

      <div class="credentials-hint">
        <div><strong>Admin:</strong> login: <code>admin</code> / pass: <code>123</code></div>
        <div><strong>Client:</strong> login: <code>client</code> / pass: <code>123</code></div>
      </div>
    </div>
  </div>

  <script src="./login.js" type="module"></script>
</body>
</html>
